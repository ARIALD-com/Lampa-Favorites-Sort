name: Validate Lampa Favorites Sort
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lampa-favorites-sort.js
      - run: node tests/plugin.test.js
